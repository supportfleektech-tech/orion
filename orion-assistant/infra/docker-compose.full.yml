services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports: ["5432:5432"]

  backend:
    build: ../backend
    env_file: ../.env
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql+psycopg://orion:orion@postgres:5432/orion
    ports: ["8000:8000"]

  frontend:
    build: ../frontend
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
