name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-assistant/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

      - name: Verify production dependency set boots
        working-directory: orion-assistant
        run: ./scripts/verify-prod-deps.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `ci` respects the lockfile; `install` silently resolves new versions,
      # which means CI can pass against dependencies nobody has reviewed.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orion-api -f ./orion-assistant/backend/Dockerfile ./orion-assistant
      - run: docker build -t orion-web ./orion-assistant/frontend
